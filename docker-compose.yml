version: '3.8'

services:
  test-case-generator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3009:3009'
    environment:
      - PORT=3009
      - NODE_ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3009/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
